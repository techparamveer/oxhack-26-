name: Sheep
options:
  bundleIdPrefix: com.oxhack
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
configFiles:
  Debug: Config/Sheep.xcconfig
  Release: Config/Sheep.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Sheep:
    type: application
    platform: iOS
    sources:
      - path: Sheep
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxhack.sheep
        PRODUCT_NAME: Sheep
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SheepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SheepTests
        type: syncedFolder
    dependencies:
      - target: Sheep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxhack.sheep.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sheep:
    build:
      targets:
        Sheep: all
        SheepTests: [test]
    test:
      targets:
        - SheepTests
      gatherCoverageData: false
    run:
      config: Debug
